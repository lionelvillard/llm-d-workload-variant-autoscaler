# P/D DISAGGREGATION VLLM-SIM SCENARIO
# Uses https://github.com/lionelvillard/vllm-simulated-model as the vLLM backend.
# Runs the full vLLM serving stack on CPU with the model forward pass replaced by
# a latency simulation. No GPUs required.
#
# Key differences from pd-disaggregation-sim.yaml (llm-d-inference-sim):
#   - Image: vllm/vllm-openai-cpu (real vLLM, CPU build) vs. a fake HTTP server
#   - SimulatedNixlConnector handles P/D KV transfer latency simulation in the
#     vLLM layer; no actual tensor movement occurs
#   - initContainer copies the plugin from ghcr.io/lionelvillard/vllm-sim-deps
#     into /plugins; PYTHONPATH=/plugins loads SimulatedForCausalLM and
#     SimulatedNixlConnector at vLLM startup
#   - SimulatedForCausalLM model config (config.json) is mounted via ConfigMap
#     at /model; vLLM reads it with --load-format=dummy (no weight download)
#   - Real vLLM Prometheus metrics available (vllm:num_requests_waiting etc.)
#     so KEDA can scale on native vLLM signals
#   - EPP router config (pd-config.yaml plugin chain) is identical to upstream
#
# Tokenizer note: vllm serve --tokenizer=facebook/opt-125m downloads the
# tokenizer from HuggingFace (~5 MB). Internet access is required on first run.

scenario:
  - name: "pd-disaggregation-vllm-sim"

    # =========================================================================
    # KUSTOMIZE DEPLOY METHOD — disabled; deploying via modelservice below
    # =========================================================================
    kustomize:
      enabled: false

      guideName: "pd-disaggregation"
      repoPath: ""
      repoRef: "main"
      gaieVersion: ""
      acceleratorBackend: "gpu/vllm"
      monitoring: false
      overlayPath: ""
      extraHelmValues: []
      extraHelmSets: {}
      guideVariableOverrides: {}
      patches: []

    # =========================================================================
    # COMMON -- Applies to all deployment methods
    # =========================================================================

    # -------------------------------------------------------------------------
    # Model Configuration
    # No GPU required; the sim serves any model name without downloading weights.
    # -------------------------------------------------------------------------
    model:
      name: facebook/opt-125m
      shortName: facebook-opt-125m
      path: models/facebook/opt-125m
      huggingfaceId: facebook/opt-125m
      gpuMemoryUtilization: 0.5
      maxModelLen: 8192
      size: 2Gi

    # -------------------------------------------------------------------------
    # Affinity / Node Selection — CPU-only nodes, no GPU required
    # -------------------------------------------------------------------------
    affinity:
      enabled: true
      nodeSelector:
        kubernetes.io/os: linux

    # -------------------------------------------------------------------------
    # Accelerator — none; memory value exists only to pass capacity-planner check
    # -------------------------------------------------------------------------
    accelerator:
      count: 0
      memory: 24

    # -------------------------------------------------------------------------
    # vLLM CPU image — runs the real vLLM serving stack without a GPU
    # -------------------------------------------------------------------------
    images:
      vllm:
        repository: vllm/vllm-openai-cpu
        tag: v0.27.0-x86_64

    # =========================================================================
    # DEPLOYMENT METHOD
    # =========================================================================
    modelservice:
      enabled: true

      # hf protocol avoids model PVC download; the sim plugin ignores weights
      uriProtocol: hf

      # -----------------------------------------------------------------------
      # Gateway topology — epponly (no Kubernetes Gateway/HTTPRoute)
      # -----------------------------------------------------------------------
      gateway:
        className: epponly

      # -----------------------------------------------------------------------
      # Routing connector — nixlv2 tells the routing-sidecar which wire protocol
      # to use when forwarding the prefill phase to the prefill pod.
      # -----------------------------------------------------------------------
      routing:
        connector: nixlv2

      # -----------------------------------------------------------------------
      # EPP router — PD plugin chain, identical to the upstream GPU scenario.
      # The plugin config is EPP-side and independent of the inference backend.
      # -----------------------------------------------------------------------
      router:
        epp:
          replicas: 1
          pluginsConfigFile: "pd-config.yaml"
          pluginsCustomConfig:
            pd-config.yaml: |
              apiVersion: llm-d.ai/v1alpha1
              kind: EndpointPickerConfig
              plugins:
              - type: disagg-headers-handler
              - type: always-disagg-pd-decider
              - type: disagg-profile-handler
                parameters:
                  deciderPluginName: always-disagg-pd-decider
              - type: prefill-filter
              - type: decode-filter
              - type: prefix-cache-scorer
              - type: queue-scorer
              - type: kv-cache-utilization-scorer
              - type: active-request-scorer
              schedulingProfiles:
              - name: prefill
                plugins:
                - pluginRef: prefill-filter
                - pluginRef: prefix-cache-scorer
                  weight: 3
                - pluginRef: queue-scorer
                  weight: 2
                - pluginRef: kv-cache-utilization-scorer
                  weight: 2
              - name: decode
                plugins:
                - pluginRef: decode-filter
                - pluginRef: active-request-scorer
                  weight: 2
                - pluginRef: prefix-cache-scorer
                  weight: 3
          resources:
            requests:
              cpu: "100m"
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
        proxy:
          resources:
            requests:
              cpu: "50m"
              memory: 128Mi
            limits:
              cpu: "500m"
              memory: 512Mi
        monitoring:
          prometheus:
            enabled: true

      # -----------------------------------------------------------------------
      # HTTPRoute timeout — mirror upstream
      # -----------------------------------------------------------------------
      httpRoute:
        requestTimeout: "300s"
        backendRequestTimeout: "0s"

    # =========================================================================
    # DECODE
    # The routing-sidecar (injected by the modelservice chart) receives requests
    # and forwards the prefill phase to the prefill pod. SimulatedNixlConnector
    # simulates the KV transfer latency on the decode side without real tensor
    # movement. vLLM binds to port 8200 (VLLM_METRICS_PORT); the routing sidecar
    # listens on 8000 and proxies to vLLM.
    # =========================================================================
    decode:
      replicas: 1
      mountModelVolume: false

      parallelism:
        tensor: 1
        data: 1
        dataLocal: 1
        workers: 1

      resources:
        limits:
          memory: 8Gi
          cpu: "4"
        requests:
          memory: 8Gi
          cpu: "4"

      accelerator:
        count: 0

      extraContainerConfig:
        ports:
          - containerPort: 8200 # TODO: use ${modelservice.decode.metricsPort} instead of hardcoded value
            name: metrics
            protocol: TCP

      monitoring:
        podmonitor:
          enabled: true
          portName: metrics
          path: /metrics
          interval: 15s

      # Copy the vllm-simulated-model plugin bundle into the shared plugins volume
      initContainers:
        - name: install-plugin
          image: ghcr.io/lionelvillard/vllm-sim-deps:v0.3.0
          imagePullPolicy: Always
          command:
            - sh
            - -c
            - cp -r /plugins/* /mnt/plugins/
          volumeMounts:
            - name: plugins
              mountPath: /mnt/plugins

      extraEnvVars:
        - name: PYTHONPATH
          value: "/plugins"
        - name: VLLM_CPU_KVCACHE_SPACE
          value: "4"
        - name: VLLM_CPU_OMP_THREADS_BIND
          value: "0-3"
        - name: HF_HOME
          value: "/tmp/huggingface"

      additionalVolumeMounts:
        - name: plugins
          mountPath: /plugins
        - name: vllm-sim-model-config
          mountPath: /model
          readOnly: true

      additionalVolumes:
        - name: plugins
          type: emptyDir
        - name: vllm-sim-model-config
          type: configMap
          configMap:
            name: pd-disaggregation-vllm-sim-model-config

      vllm:
        customCommand: >-
          vllm serve /model
          --tokenizer=facebook/opt-125m
          --load-format=dummy
          --max-model-len=8192
          --host=0.0.0.0
          --served-model-name=facebook/opt-125m
          --port=$VLLM_METRICS_PORT
          --gpu-memory-utilization=0.5
          --enforce-eager
          --no-enable-log-requests
          --disable-uvicorn-access-log
          --kv-transfer-config
          '{"kv_connector":"SimulatedNixlConnector","kv_role":"kv_consumer","kv_connector_extra_config":{"bandwidth_gbps":100,"handshake_ms":2}}'

    # =========================================================================
    # PREFILL
    # SimulatedNixlConnector on the prefill side simulates KV transfer latency
    # after the prefill pass completes. vLLM binds to port 8000 (VLLM_INFERENCE_PORT)
    # so the routing sidecar on decode pods can reach the prefill pod directly.
    # =========================================================================
    prefill:
      enabled: true
      replicas: 1
      mountModelVolume: false

      parallelism:
        tensor: 1
        data: 1
        dataLocal: 1
        workers: 1

      extraContainerConfig:
        ports:
          - containerPort: 8000 # TODO: use ${modelservice.prefill.metricsPort} instead of hardcoded value
            name: metrics
            protocol: TCP

      monitoring:
        podmonitor:
          enabled: true
          portName: metrics
          path: /metrics
          interval: 15s

      resources:
        limits:
          memory: 8Gi
          cpu: "4"
        requests:
          memory: 8Gi
          cpu: "4"

      accelerator:
        count: 0

      initContainers:
        - name: install-plugin
          image: ghcr.io/lionelvillard/vllm-sim-deps:v0.3.0
          imagePullPolicy: Always
          command:
            - sh
            - -c
            - cp -r /plugins/* /mnt/plugins/
          volumeMounts:
            - name: plugins
              mountPath: /mnt/plugins

      extraEnvVars:
        - name: PYTHONPATH
          value: "/plugins"
        - name: VLLM_CPU_KVCACHE_SPACE
          value: "4"
        - name: VLLM_CPU_OMP_THREADS_BIND
          value: "0-3"
        - name: HF_HOME
          value: "/tmp/huggingface"

      additionalVolumeMounts:
        - name: plugins
          mountPath: /plugins
        - name: vllm-sim-model-config
          mountPath: /model
          readOnly: true

      additionalVolumes:
        - name: plugins
          type: emptyDir
        - name: vllm-sim-model-config
          type: configMap
          configMap:
            name: pd-disaggregation-vllm-sim-model-config

      vllm:
        customCommand: >-
          vllm serve /model
          --tokenizer=facebook/opt-125m
          --load-format=dummy
          --max-model-len=8192
          --host=0.0.0.0
          --served-model-name=facebook/opt-125m
          --port=$VLLM_INFERENCE_PORT
          --gpu-memory-utilization=0.5
          --enforce-eager
          --no-enable-log-requests
          --disable-uvicorn-access-log
          --kv-transfer-config
          '{"kv_connector":"SimulatedNixlConnector","kv_role":"kv_producer","kv_connector_extra_config":{"bandwidth_gbps":100,"handshake_ms":2}}'

    standalone:
      enabled: false

    keda:
      enabled: true

      namespace: ""              # defaults to deploy namespace (first slot of `-p`)

      prometheus:
        baseUrl: http://prometheus-operated.monitoring.svc.cluster.local
        port: 9090

      scaledObjects:
      - name: pd-disaggregation-vllm-sim-decode
        scaleTargetRef:
          kind: Deployment
          name: ${model.idLabel}-decode
        minReplicas: 1
        maxReplicas: 4
        unsafeSsl: true
        triggers:
          - name: vllm-queue-size
            type: prometheus
            query: 'max(vllm:num_requests_waiting{model_name="${model.name}",role="decode"})'
            threshold: "20"
            metricType: AverageValue
            activationThreshold: "0"
          - name: vllm-kv-utilization
            type: prometheus
            query: 'max(vllm:kv_cache_usage_perc{model_name="${model.name}",role="decode"})'
            threshold: "0.95"
            metricType: AverageValue
            activationThreshold: "0"
        behavior:
          scaleUp:
            stabilizationWindowSeconds: 0
            policies:
              - type: Pods
                value: 1
                periodSeconds: 180
          scaleDown:
            stabilizationWindowSeconds: 300
            policies:
              - type: Pods
                value: 1
                periodSeconds: 300
      - name: pd-disaggregation-vllm-sim-prefill
        scaleTargetRef:
          kind: Deployment
          name: ${model.idLabel}-prefill
        minReplicas: 1
        maxReplicas: 4
        unsafeSsl: true
        triggers:
          - name: vllm-queue-size
            type: prometheus
            query: 'max(vllm:num_requests_waiting{model_name="${model.name}",role="prefill"})'
            threshold: "20"
            metricType: AverageValue
            activationThreshold: "0"
          - name: vllm-kv-utilization
            type: prometheus
            query: 'max(vllm:kv_cache_usage_perc{model_name="${model.name}",role="prefill"})'
            threshold: "0.95"
            metricType: AverageValue
            activationThreshold: "0"
        behavior:
          scaleUp:
            stabilizationWindowSeconds: 0
            policies:
              - type: Pods
                value: 1
                periodSeconds: 180
          scaleDown:
            stabilizationWindowSeconds: 300
            policies:
              - type: Pods
                value: 1
                periodSeconds: 300

    # =========================================================================
    # COMMON — vLLM Common
    # Shared memory volume only; plugin and model-config volumes are per-pod
    # (decode.additionalVolumes / prefill.additionalVolumes) to allow future
    # scenarios to use different model configs per role.
    # =========================================================================
    vllmCommon:
      shmMemory: 500Mi
      volumes:
        - name: dshm
          type: emptyDir
          emptyDir:
            medium: Memory
            sizeLimit: 500Mi
      volumeMounts:
        - name: dshm
          mountPath: /dev/shm

    # =========================================================================
    # EXTRA OBJECTS
    # ConfigMap with SimulatedForCausalLM config.json for facebook/opt-125m.
    # vLLM reads this from /model (--load-format=dummy skips weight download).
    # =========================================================================
    extraObjects:
      - apiVersion: v1
        kind: ConfigMap
        metadata:
          name: pd-disaggregation-vllm-sim-model-config
        data:
          config.json: |
            {
              "architectures": ["SimulatedForCausalLM"],
              "model_type": "opt",
              "hidden_size": 768,
              "num_hidden_layers": 12,
              "num_attention_heads": 12,
              "num_key_value_heads": 12,
              "intermediate_size": 3072,
              "vocab_size": 50272,
              "max_position_embeddings": 2048,
              "eos_token_id": 2,
              "torch_dtype": "float16",
              "latency": {
                "type": "linear",
                "base_ms": 5.0,
                "prefill_ms_per_token": 0.5,
                "decode_ms_per_seq": 10.0,
                "ctx_ms_per_ktoken": 0.1,
                "deterministic_length": true
              }
            }

    # =========================================================================
    # STORAGE
    # =========================================================================
    storage:
      workloadPvc:
        accessModes:
          - ReadWriteOnce
        storageClassName: auto
      modelPvc:
        size: 2Gi
        accessModes:
          - ReadWriteOnce
        storageClassName: auto

    # =========================================================================
    # TIMEOUTS — mirror upstream values
    # =========================================================================
    timeouts:
      controlWait: 300
      harnessWait: 900000

    # =========================================================================
    # WORKLOAD / HARNESS
    # =========================================================================
    workDir: "~/data/pd-disaggregation-vllm-sim"

    harness:
      name: inference-perf
      experimentProfile: sanity_random.yaml
      pvcSize: 3Gi
      resources:
        cpu: "1"
        memory: 2Gi
