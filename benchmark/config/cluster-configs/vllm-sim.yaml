# BACKEND OVERLAY — vLLM CPU + latency-simulation plugin (no GPU)
# Apply with: --cluster-config benchmark/config/cluster-configs/vllm-sim.yaml
#
# Priority backend. Runs the real vLLM serving stack on CPU with the model
# forward pass replaced by github.com/lionelvillard/vllm-simulated-model, so
# native vllm: Prometheus metrics are available for the scenario's KEDA strategy.
#   - initContainer copies the plugin from ghcr.io/lionelvillard/vllm-sim-deps
#     into /plugins; PYTHONPATH=/plugins loads SimulatedForCausalLM and
#     SimulatedNixlConnector at vLLM startup.
#   - SimulatedForCausalLM config.json is mounted from a ConfigMap at /model;
#     vLLM reads it with --load-format=dummy (no weight download).
#   - SimulatedNixlConnector simulates P/D KV-transfer latency (no tensor move).
#
# Tokenizer note: `--tokenizer=facebook/opt-125m` downloads ~5 MB from
# HuggingFace on first run; internet access required.
#
# Merge note: dicts deep-merge, lists replace wholesale. This overlay never sets
# `keda`.

affinity:
  enabled: true
  nodeSelector:
    kubernetes.io/os: linux

accelerator:
  count: 0
  memory: 24

model:
  gpuMemoryUtilization: 0.5

images:
  vllm:
    repository: vllm/vllm-openai-cpu
    tag: v0.27.0-x86_64

decode:
  mountModelVolume: false
  accelerator:
    count: 0
  resources:
    limits:
      memory: 8Gi
      cpu: "4"
    requests:
      memory: 8Gi
      cpu: "4"
  initContainers:
    - name: install-plugin
      image: ghcr.io/lionelvillard/vllm-sim-deps:v0.3.0
      imagePullPolicy: Always
      command:
        - sh
        - -c
        - cp -r /plugins/* /mnt/plugins/
      volumeMounts:
        - name: plugins
          mountPath: /mnt/plugins
  extraEnvVars:
    - name: PYTHONPATH
      value: "/plugins"
    - name: VLLM_CPU_KVCACHE_SPACE
      value: "4"
    - name: VLLM_CPU_OMP_THREADS_BIND
      value: "0-3"
    - name: HF_HOME
      value: "/tmp/huggingface"
  additionalVolumeMounts:
    - name: plugins
      mountPath: /plugins
    - name: vllm-sim-model-config
      mountPath: /model
      readOnly: true
  additionalVolumes:
    - name: plugins
      type: emptyDir
    - name: vllm-sim-model-config
      type: configMap
      configMap:
        name: vllm-sim-model-config
  vllm:
    customCommand: >-
      vllm serve /model
      --tokenizer=facebook/opt-125m
      --load-format=dummy
      --max-model-len=8192
      --host=0.0.0.0
      --served-model-name=facebook/opt-125m
      --port=$VLLM_METRICS_PORT
      --gpu-memory-utilization=0.5
      --enforce-eager
      --no-enable-log-requests
      --disable-uvicorn-access-log
      --kv-transfer-config
      '{"kv_connector":"SimulatedNixlConnector","kv_role":"kv_consumer","kv_connector_extra_config":{"bandwidth_gbps":100,"handshake_ms":2}}'

prefill:
  mountModelVolume: false
  accelerator:
    count: 0
  resources:
    limits:
      memory: 8Gi
      cpu: "4"
    requests:
      memory: 8Gi
      cpu: "4"
  initContainers:
    - name: install-plugin
      image: ghcr.io/lionelvillard/vllm-sim-deps:v0.3.0
      imagePullPolicy: Always
      command:
        - sh
        - -c
        - cp -r /plugins/* /mnt/plugins/
      volumeMounts:
        - name: plugins
          mountPath: /mnt/plugins
  extraEnvVars:
    - name: PYTHONPATH
      value: "/plugins"
    - name: VLLM_CPU_KVCACHE_SPACE
      value: "4"
    - name: VLLM_CPU_OMP_THREADS_BIND
      value: "0-3"
    - name: HF_HOME
      value: "/tmp/huggingface"
  additionalVolumeMounts:
    - name: plugins
      mountPath: /plugins
    - name: vllm-sim-model-config
      mountPath: /model
      readOnly: true
  additionalVolumes:
    - name: plugins
      type: emptyDir
    - name: vllm-sim-model-config
      type: configMap
      configMap:
        name: vllm-sim-model-config
  vllm:
    customCommand: >-
      vllm serve /model
      --tokenizer=facebook/opt-125m
      --load-format=dummy
      --max-model-len=8192
      --host=0.0.0.0
      --served-model-name=facebook/opt-125m
      --port=$VLLM_INFERENCE_PORT
      --gpu-memory-utilization=0.5
      --enforce-eager
      --no-enable-log-requests
      --disable-uvicorn-access-log
      --kv-transfer-config
      '{"kv_connector":"SimulatedNixlConnector","kv_role":"kv_producer","kv_connector_extra_config":{"bandwidth_gbps":100,"handshake_ms":2}}'

# SimulatedForCausalLM config.json (facebook/opt-125m). vLLM reads it from /model.
extraObjects:
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: vllm-sim-model-config
    data:
      config.json: |
        {
          "architectures": ["SimulatedForCausalLM"],
          "model_type": "opt",
          "hidden_size": 768,
          "num_hidden_layers": 12,
          "num_attention_heads": 12,
          "num_key_value_heads": 12,
          "intermediate_size": 3072,
          "vocab_size": 50272,
          "max_position_embeddings": 2048,
          "eos_token_id": 2,
          "torch_dtype": "float16",
          "latency": {
            "type": "linear",
            "base_ms": 5.0,
            "prefill_ms_per_token": 0.5,
            "decode_ms_per_seq": 10.0,
            "ctx_ms_per_ktoken": 0.1,
            "deterministic_length": true
          }
        }
