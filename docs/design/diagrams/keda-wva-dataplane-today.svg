<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 850" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="arrowGrey2" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowGrey2s" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M10,0 L0,5 L10,10 z" fill="#94a3b8"/>
    </marker>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.8" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="575" y="34" text-anchor="middle" font-size="23" font-weight="700" fill="#0f172a">KEDA + WVA today — data plane</text>
  <text x="575" y="57" text-anchor="middle" font-size="13" fill="#64748b">Two deciders, same three stages. Each exposes a composite metric to the HPA.</text>

  <!-- Stage bands -->
  <rect x="15" y="95"  width="1120" height="140" fill="#eff6ff"/>
  <rect x="15" y="250" width="1120" height="100" fill="#fffbeb"/>
  <rect x="15" y="365" width="1120" height="115" fill="#f0fdf4"/>

  <!-- Stage labels -->
  <text transform="rotate(-90 34 165)" x="34" y="165" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="2" fill="#2563eb">SENSE</text>
  <text transform="rotate(-90 34 300)" x="34" y="300" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="2" fill="#d97706">DECIDE</text>
  <text transform="rotate(-90 34 422)" x="34" y="422" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="2" fill="#16a34a">EXPOSE</text>

  <!-- Product outlines -->
  <rect x="55"  y="100" width="360" height="380" rx="14" fill="none" stroke="#7c3aed" stroke-width="2"/>
  <rect x="735" y="100" width="360" height="380" rx="14" fill="none" stroke="#0d9488" stroke-width="2"/>
  <text x="235" y="86" text-anchor="middle" font-size="18" font-weight="700" fill="#7c3aed">WVA</text>
  <text x="915" y="86" text-anchor="middle" font-size="18" font-weight="700" fill="#0d9488">KEDA</text>

  <!-- ===================== SENSE ===================== -->
  <!-- WVA collector -->
  <rect x="75" y="110" width="320" height="110" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" filter="url(#softShadow)"/>
  <text x="235" y="132" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">Metrics Collector</text>
  <rect x="90" y="145" width="138" height="60" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.3" stroke-dasharray="5 3"/>
  <text x="159" y="170" text-anchor="middle" font-size="11.5" font-weight="700" fill="#334155">Pods source</text>
  <text x="159" y="188" text-anchor="middle" font-size="10.5" fill="#64748b">scale-from-zero</text>
  <rect x="242" y="145" width="138" height="60" rx="6" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="311" y="170" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1e3a8a">Prometheus</text>
  <text x="311" y="188" text-anchor="middle" font-size="10.5" fill="#334155">metrics source</text>

  <!-- KEDA scaler -->
  <rect x="755" y="110" width="320" height="110" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" filter="url(#softShadow)"/>
  <text x="915" y="132" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">Scaler</text>
  <rect x="770" y="145" width="140" height="60" rx="6" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2.4"/>
  <text x="840" y="170" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1e3a8a">Prometheus Scaler</text>
  <text x="840" y="188" text-anchor="middle" font-size="10.5" fill="#334155">(one of many scalers)</text>
  <rect x="922" y="145" width="138" height="60" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.3" stroke-dasharray="5 3"/>
  <text x="991" y="170" text-anchor="middle" font-size="11.5" font-weight="700" fill="#334155">activation</text>
  <text x="991" y="188" text-anchor="middle" font-size="10.5" fill="#64748b">scale-from-zero</text>

  <!-- Prometheus spine -->
  <rect x="485" y="110" width="180" height="240" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2" filter="url(#softShadow)"/>
  <text x="575" y="200" text-anchor="middle" font-size="15" font-weight="700" fill="#334155">Prometheus</text>
  <text x="575" y="220" text-anchor="middle" font-size="11" fill="#64748b">shared metric store</text>

  <!-- read metrics -->
  <path d="M485,176 L397,176" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="441" y="168" text-anchor="middle" font-size="10" fill="#475569">read metrics</text>
  <path d="M665,176 L753,176" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="709" y="168" text-anchor="middle" font-size="10" fill="#475569">read metrics</text>

  <!-- ===================== DECIDE ===================== -->
  <rect x="75" y="265" width="320" height="70" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" filter="url(#softShadow)"/>
  <text x="235" y="295" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">Analyzer + Optimizer</text>
  <text x="235" y="315" text-anchor="middle" font-size="11" fill="#334155">global cost-aware optimization</text>

  <rect x="755" y="265" width="320" height="70" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" filter="url(#softShadow)"/>
  <text x="915" y="295" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">Scaling-modifier formula</text>
  <text x="915" y="315" text-anchor="middle" font-size="11" fill="#334155">expr over named triggers</text>

  <!-- internal down: sense->decide -->
  <path d="M235,220 L235,265" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M915,220 L915,265" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- internal down: decide->expose -->
  <path d="M235,335 L235,383" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M915,335 L915,383" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===================== EXPOSE ===================== -->
  <!-- WVA composite metric (single) -->
  <rect x="75" y="383" width="320" height="72" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" filter="url(#softShadow)"/>
  <text x="235" y="408" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">Composite metric</text>
  <text x="235" y="427" text-anchor="middle" font-size="11" fill="#334155">wva_desired_replicas</text>
  <text x="235" y="444" text-anchor="middle" font-size="10" fill="#166534">one, global — all variants</text>
  <circle cx="366" cy="401" r="13" fill="#166534"/>
  <text x="366" y="405" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">×1</text>

  <!-- KEDA composite metric (stacked = one per ScaledObject) -->
  <rect x="772" y="375" width="300" height="60" rx="8" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.3"/>
  <rect x="766" y="381" width="300" height="60" rx="8" fill="#ccf3d6" stroke="#16a34a" stroke-width="1.3"/>
  <rect x="760" y="387" width="300" height="60" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6" filter="url(#softShadow)"/>
  <text x="910" y="412" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">composite-metric</text>
  <text x="910" y="431" text-anchor="middle" font-size="11" fill="#334155">formula output</text>
  <text x="910" y="465" text-anchor="middle" font-size="10" fill="#166534">one per ScaledObject</text>
  <circle cx="1028" cy="401" r="13" fill="#166534"/>
  <text x="1028" y="405" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">×N</text>

  <!-- KEDA metric server (shared spine, muted) -->
  <rect x="485" y="388" width="180" height="64" rx="10" fill="#f1f5f9" stroke="#0d9488" stroke-width="1.6" stroke-dasharray="4 3"/>
  <text x="575" y="414" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f766e">KEDA metric server</text>
  <text x="575" y="432" text-anchor="middle" font-size="10" fill="#64748b">exposes metrics to HPA</text>

  <!-- composite metrics -> metric server -->
  <path d="M397,420 L483,420" fill="none" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arrowRed)"/>
  <text x="440" y="412" text-anchor="middle" font-size="9.5" font-weight="600" fill="#dc2626">expose</text>
  <path d="M758,420 L667,420" fill="none" stroke="#0d9488" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="712" y="412" text-anchor="middle" font-size="9.5" font-weight="600" fill="#0f766e">expose</text>

  <!-- metric server -> HPA -->
  <path d="M575,452 L575,516" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- HPA -->
  <rect x="485" y="518" width="180" height="58" rx="10" fill="#e2e8f0" stroke="#334155" stroke-width="2" filter="url(#softShadow)"/>
  <text x="575" y="543" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">HPA</text>
  <text x="575" y="561" text-anchor="middle" font-size="10.5" fill="#475569">computes replicas &amp; actuates</text>

  <!-- HPA -> Deployment -->
  <path d="M575,576 L575,612" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="585" y="600" text-anchor="start" font-size="10" fill="#475569">set .spec.replicas</text>

  <!-- Deployment -->
  <rect x="425" y="612" width="240" height="70" rx="10" fill="#e2e8f0" stroke="#334155" stroke-width="2" filter="url(#softShadow)"/>
  <text x="545" y="642" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">vLLM model server</text>
  <text x="545" y="662" text-anchor="middle" font-size="11" fill="#475569">Deployment — N replicas</text>

  <!-- EPP -->
  <rect x="785" y="612" width="220" height="70" rx="10" fill="#e2e8f0" stroke="#334155" stroke-width="2" filter="url(#softShadow)"/>
  <text x="895" y="642" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">EPP</text>
  <text x="895" y="662" text-anchor="middle" font-size="11" fill="#475569">endpoint picker — request metrics</text>

  <!-- Deployment -> Prometheus (scrape) : up left channel -->
  <path d="M455,612 L455,338 L483,338" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="447" y="500" text-anchor="end" font-size="10" fill="#475569">vLLM metrics</text>

  <!-- EPP -> Prometheus (scrape) : out top, across clear band, up right channel -->
  <path d="M855,612 L855,596 L700,596 L700,338 L667,338" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="710" y="520" text-anchor="start" font-size="10" fill="#475569">EPP metrics</text>

  <!-- ===================== Footnotes ===================== -->
  <text x="575" y="712" text-anchor="middle" font-size="11.5" fill="#475569">Both deciders expose a composite metric to the HPA via KEDA's metric server; the HPA performs the actuation.</text>
  <text x="575" y="730" text-anchor="middle" font-size="11.5" fill="#475569">WVA emits <tspan font-weight="700">one global</tspan> composite metric; KEDA emits <tspan font-weight="700">one per ScaledObject</tspan>.</text>
  <text x="575" y="748" text-anchor="middle" font-size="10.5" font-style="italic" fill="#94a3b8">Shown as parallel peers for clarity; today WVA's metric reaches the metric server through Prometheus and a KEDA Prometheus trigger.</text>

  <!-- ===================== A / B spectrum bar ===================== -->
  <line x1="235" y1="795" x2="915" y2="795" stroke="#94a3b8" stroke-width="2.5" marker-start="url(#arrowGrey2s)" marker-end="url(#arrowGrey2)"/>
  <circle cx="575" cy="795" r="4" fill="#94a3b8"/>
  <text x="575" y="785" text-anchor="middle" font-size="9.5" fill="#94a3b8">today</text>
  <text x="235" y="822" text-anchor="middle" font-size="11.5" font-weight="700" fill="#7c3aed">◀ Approach B</text>
  <text x="235" y="838" text-anchor="middle" font-size="10" fill="#64748b">WVA decides &amp; actuates</text>
  <text x="915" y="822" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0d9488">Approach A ▶</text>
  <text x="915" y="838" text-anchor="middle" font-size="10" fill="#64748b">KEDA assembles &amp; actuates</text>
</svg>
