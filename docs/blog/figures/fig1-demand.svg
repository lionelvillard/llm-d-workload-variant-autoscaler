<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" font-family="system-ui, -apple-system, sans-serif" font-size="13">
  <defs>
    <style>
      .axis { stroke: #1f2937; stroke-width: 1; fill: none; }
      .grid { stroke: #e5e7eb; stroke-width: 1; fill: none; }
      .rate { stroke: #2563eb; stroke-width: 2.5; fill: none; stroke-linejoin: round; }
      .stock { stroke: #059669; stroke-width: 2.5; fill: none; stroke-linejoin: round; }
      .stock-fill { fill: #05966922; stroke: none; }
      .rate-fill { fill: #2563eb1a; stroke: none; }
      .label { fill: #1f2937; }
      .muted { fill: #6b7280; font-size: 11px; }
      .title { font-weight: 600; fill: #111827; font-size: 14px; }
      .phase { fill: #6b7280; font-size: 11px; font-style: italic; }
    </style>
  </defs>

  <!-- Top panel: prefill demand rate -->
  <text class="title" x="70" y="30">Incoming demand (prefill rate, tokens / sec)</text>

  <!-- grid lines -->
  <line class="grid" x1="70" y1="60" x2="770" y2="60"/>
  <line class="grid" x1="70" y1="110" x2="770" y2="110"/>
  <line class="grid" x1="70" y1="160" x2="770" y2="160"/>
  <line class="grid" x1="70" y1="210" x2="770" y2="210"/>

  <!-- y-axis labels -->
  <text class="muted" x="62" y="64" text-anchor="end">12k</text>
  <text class="muted" x="62" y="114" text-anchor="end">8k</text>
  <text class="muted" x="62" y="164" text-anchor="end">4k</text>
  <text class="muted" x="62" y="214" text-anchor="end">0</text>

  <!-- axes -->
  <line class="axis" x1="70" y1="50" x2="70" y2="220"/>
  <line class="axis" x1="70" y1="220" x2="770" y2="220"/>

  <!-- demand rate path: 5-phase shape -->
  <path class="rate-fill" d="M 70 213 L 187 213 L 303 152 L 537 152 L 537 57 L 583 57 L 583 152 L 630 186 L 677 199 L 723 204 L 770 205 L 770 220 L 70 220 Z"/>
  <path class="rate" d="M 70 213 L 187 213 L 303 152 L 537 152 L 537 57 L 583 57 L 583 152 L 630 186 L 677 199 L 723 204 L 770 205"/>

  <!-- phase labels -->
  <text class="phase" x="125" y="245">baseline</text>
  <text class="phase" x="230" y="245">ramp</text>
  <text class="phase" x="400" y="245">plateau</text>
  <text class="phase" x="540" y="245">burst</text>
  <text class="phase" x="660" y="245">decay</text>

  <!-- Bottom panel: KV cache demand stock -->
  <text class="title" x="70" y="295">KV-cache demand (active tokens resident)</text>

  <line class="grid" x1="70" y1="320" x2="770" y2="320"/>
  <line class="grid" x1="70" y1="370" x2="770" y2="370"/>
  <line class="grid" x1="70" y1="420" x2="770" y2="420"/>

  <text class="muted" x="62" y="324" text-anchor="end">high</text>
  <text class="muted" x="62" y="374" text-anchor="end">med</text>
  <text class="muted" x="62" y="424" text-anchor="end">low</text>

  <line class="axis" x1="70" y1="310" x2="70" y2="475"/>
  <line class="axis" x1="70" y1="475" x2="770" y2="475"/>

  <!-- KV demand: lagged + smoothed shape, peaks after the rate peak -->
  <path class="stock-fill" d="M 70 460 L 187 460 Q 245 440 303 405 L 530 405 Q 555 395 580 370 Q 610 345 640 335 Q 680 360 720 410 L 770 440 L 770 475 L 70 475 Z"/>
  <path class="stock" d="M 70 460 L 187 460 Q 245 440 303 405 L 530 405 Q 555 395 580 370 Q 610 345 640 335 Q 680 360 720 410 L 770 440"/>

  <!-- annotation: lag arrow -->
  <line x1="560" y1="65" x2="560" y2="335" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="640" y1="335" x2="640" y2="65" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3 3"/>
  <path d="M 560 100 L 638 100" stroke="#6b7280" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/>
  <text class="muted" x="600" y="92" text-anchor="middle" font-style="italic">lag</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- x axis label -->
  <text class="muted" x="420" y="510" text-anchor="middle">time (minutes)</text>
  <text class="muted" x="70" y="495" text-anchor="middle">0</text>
  <text class="muted" x="187" y="495" text-anchor="middle">5</text>
  <text class="muted" x="303" y="495" text-anchor="middle">10</text>
  <text class="muted" x="537" y="495" text-anchor="middle">20</text>
  <text class="muted" x="770" y="495" text-anchor="middle">30</text>
</svg>
