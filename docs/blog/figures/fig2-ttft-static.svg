<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="system-ui, -apple-system, sans-serif" font-size="13">
  <defs>
    <style>
      .axis { stroke: #1f2937; stroke-width: 1; fill: none; }
      .grid { stroke: #e5e7eb; stroke-width: 1; fill: none; }
      .ttft { stroke: #dc2626; stroke-width: 2.5; fill: none; stroke-linejoin: round; }
      .slo { stroke: #6b7280; stroke-width: 1.5; stroke-dasharray: 6 4; fill: none; }
      .scatter { fill: #dc26264d; }
      .label { fill: #1f2937; }
      .muted { fill: #6b7280; font-size: 11px; }
      .title { font-weight: 600; fill: #111827; font-size: 14px; }
      .annot { fill: #6b7280; font-size: 11px; font-style: italic; }
    </style>
  </defs>

  <text class="title" x="70" y="30">TTFT under optimal-static supply (one replica count for the whole trace)</text>

  <!-- grid -->
  <line class="grid" x1="70" y1="80" x2="770" y2="80"/>
  <line class="grid" x1="70" y1="140" x2="770" y2="140"/>
  <line class="grid" x1="70" y1="200" x2="770" y2="200"/>
  <line class="grid" x1="70" y1="260" x2="770" y2="260"/>

  <text class="muted" x="62" y="84" text-anchor="end">800ms</text>
  <text class="muted" x="62" y="144" text-anchor="end">600ms</text>
  <text class="muted" x="62" y="204" text-anchor="end">400ms</text>
  <text class="muted" x="62" y="264" text-anchor="end">200ms</text>
  <text class="muted" x="62" y="304" text-anchor="end">0</text>

  <line class="axis" x1="70" y1="50" x2="70" y2="300"/>
  <line class="axis" x1="70" y1="300" x2="770" y2="300"/>

  <!-- SLO line at 500ms (y=170) -->
  <line class="slo" x1="70" y1="170" x2="770" y2="170"/>
  <text class="annot" x="765" y="164" text-anchor="end">SLO: P95 TTFT ≤ 500 ms</text>

  <!-- scatter dots: per-request TTFT -->
  <!-- baseline & ramp & plateau: low scatter around 100-200ms -->
  <g class="scatter">
    <circle cx="90" cy="280" r="2"/>
    <circle cx="105" cy="275" r="2"/>
    <circle cx="120" cy="270" r="2"/>
    <circle cx="140" cy="282" r="2"/>
    <circle cx="160" cy="278" r="2"/>
    <circle cx="180" cy="272" r="2"/>
    <circle cx="200" cy="265" r="2"/>
    <circle cx="220" cy="262" r="2"/>
    <circle cx="240" cy="258" r="2"/>
    <circle cx="260" cy="252" r="2"/>
    <circle cx="280" cy="248" r="2"/>
    <circle cx="310" cy="240" r="2"/>
    <circle cx="340" cy="245" r="2"/>
    <circle cx="370" cy="238" r="2"/>
    <circle cx="400" cy="242" r="2"/>
    <circle cx="430" cy="236" r="2"/>
    <circle cx="460" cy="244" r="2"/>
    <circle cx="490" cy="240" r="2"/>
    <circle cx="520" cy="235" r="2"/>
    <!-- burst region: scatter rises -->
    <circle cx="540" cy="220" r="2.5"/>
    <circle cx="548" cy="200" r="2.5"/>
    <circle cx="556" cy="185" r="2.5"/>
    <circle cx="563" cy="172" r="2.5"/>
    <circle cx="568" cy="160" r="2.5"/>
    <circle cx="572" cy="155" r="3"/>
    <circle cx="576" cy="148" r="3"/>
    <!-- a few above SLO -->
    <circle cx="558" cy="135" r="2.5" fill="#dc262699"/>
    <circle cx="570" cy="120" r="2.5" fill="#dc262699"/>
    <circle cx="578" cy="110" r="2.5" fill="#dc262699"/>
    <circle cx="582" cy="158" r="3"/>
    <circle cx="588" cy="172" r="2.5"/>
    <!-- decay: scatter drops back down -->
    <circle cx="610" cy="195" r="2"/>
    <circle cx="640" cy="215" r="2"/>
    <circle cx="670" cy="240" r="2"/>
    <circle cx="700" cy="258" r="2"/>
    <circle cx="730" cy="270" r="2"/>
    <circle cx="760" cy="278" r="2"/>
  </g>

  <!-- P95 rolling line: low, climbs to kiss SLO during burst, returns -->
  <path class="ttft" d="M 70 268 L 187 265 Q 250 258 303 248 L 530 240 Q 555 215 580 175 L 590 173 Q 600 178 630 210 Q 680 250 770 270"/>

  <!-- annotation: P95 kisses SLO -->
  <line x1="585" y1="60" x2="585" y2="170" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3 3"/>
  <text class="annot" x="585" y="55" text-anchor="middle">P95 just touches SLO at the burst</text>

  <!-- legend -->
  <circle class="scatter" cx="640" cy="332" r="2.5"/>
  <text class="muted" x="650" y="336">individual requests</text>
  <line class="ttft" x1="730" y1="332" x2="755" y2="332"/>
  <text class="muted" x="760" y="336">P95 rolling</text>

  <!-- x labels -->
  <text class="muted" x="420" y="365" text-anchor="middle">time (minutes)</text>
  <text class="muted" x="70" y="318" text-anchor="middle">0</text>
  <text class="muted" x="187" y="318" text-anchor="middle">5</text>
  <text class="muted" x="303" y="318" text-anchor="middle">10</text>
  <text class="muted" x="537" y="318" text-anchor="middle">20</text>
  <text class="muted" x="770" y="318" text-anchor="middle">30</text>
</svg>
