# Overlay for meta/llama-3.1-70b in namespace llm-inference.
# All tunables live in prometheusrule.yaml; this file only identifies the
# model and sets replica bounds.
#
# minReplicaCount=2 keeps a hot replica for failover — cold-starting a 70B
# pod to rescue a failing one would blow TTFT for ~5 minutes.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base
- prometheusrule.yaml
namespace: llm-inference
patches:
- target:
    kind: ScaledObject
    name: PLACEHOLDER-predictive-scaler
  patch: |-
    - op: replace
      path: /metadata/name
      value: llama-3-70b-predictive-scaler
    - op: replace
      path: /metadata/namespace
      value: llm-inference
    - op: replace
      path: /metadata/labels/app
      value: llama-3-70b
    - op: replace
      path: /spec/scaleTargetRef/name
      value: llama-3-70b
    - op: replace
      path: /spec/minReplicaCount
      value: 2
    - op: replace
      path: /spec/maxReplicaCount
      value: 6
    - op: replace
      path: /spec/advanced/horizontalPodAutoscalerConfig/name
      value: keda-predictive-llama-3-70b
    - op: replace
      path: /spec/triggers/0/metadata/query
      value: wva:desired_replicas{model_name="meta/llama-3.1-70b", namespace="llm-inference"}
