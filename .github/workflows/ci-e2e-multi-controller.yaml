name: CI - E2E Multi-controller

# Dedicated job for the dual namespace-scoped controllers e2e suite. Runs in
# its own kind cluster so the primary and secondary controllers can both be
# installed namespace-scoped from the start, eliminating the shared
# ClusterRoleBinding name collisions that the previous in-smoke variant
# worked around with kubectl patch-and-restore.

# Cancel previous runs on the same PR when new commits are pushed.
concurrency:
  group: >-
    ${{
      github.event_name == 'issue_comment' &&
      !contains(github.event.comment.body, '/ok-to-test')
      && format('comment-isolated-{0}', github.run_id)
      || format('ci-e2e-multi-controller-{0}',
           github.event.pull_request.number
           || github.event.issue.number
           || github.run_id)
    }}
  cancel-in-progress: true

on:
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

jobs:
  check-code-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      has_code_changes: ${{ steps.set-output.outputs.has_code_changes }}
      pr_head_sha: ${{ steps.pr-info.outputs.pr_head_sha }}
      pr_head_repo: ${{ steps.pr-info.outputs.pr_head_repo }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Check for code changes
        uses: dorny/paths-filter@v3
        id: filter
        continue-on-error: true
        with:
          predicate-quantifier: 'every'
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!README.md'
              - '!CONTRIBUTING.md'
              - '!LICENSE'
              - '!OWNERS'
              - '!PROJECT'

      - name: Set output with default
        id: set-output
        run: |
          FILTER_OUTPUT="${{ steps.filter.outputs.code }}"
          if [ -n "$FILTER_OUTPUT" ]; then
            echo "has_code_changes=$FILTER_OUTPUT" >> $GITHUB_OUTPUT
          else
            echo "has_code_changes=true" >> $GITHUB_OUTPUT
          fi

  e2e-multi-controller:
    runs-on: ubuntu-latest
    needs: [check-code-changes]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && needs.check-code-changes.outputs.has_code_changes == 'true')
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Extract Go version from go.mod
        run: sed -En 's/^go (.*)$/GO_VERSION=\1/p' go.mod >> $GITHUB_ENV

      - name: Set up Go with cache
        uses: actions/setup-go@v6
        with:
          go-version: "${{ env.GO_VERSION }}"
          cache-dependency-path: ./go.sum

      - name: Install dependencies
        run: go mod download

      - name: Install Kind
        run: deploy/ci-pr-checks/install-kind.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build WVA image locally
        id: build-image
        env:
          CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: deploy/ci-pr-checks/build-wva-image-local.sh

      - name: Run e2e tests (multi-controller)
        shell: bash
        env:
          ENVIRONMENT: kind-emulator
          USE_SIMULATOR: "true"
          SCALE_TO_ZERO_ENABLED: "false"
          CREATE_CLUSTER: "true"
          DELETE_CLUSTER: "true"
          LLM_D_RELEASE: "v0.7.0"
          # Both controllers run namespace-scoped from the start. WVA_OVERLAY pins
          # the primary controller install to the namespace-scoped/kubernetes overlay;
          # the secondary controller's overlay comes from the testdata directory.
          WVA_OVERLAY: config/overlays/namespace-scoped/kubernetes
          WVA_E2E_SECONDARY_OVERLAY_PATH: ${{ github.workspace }}/test/e2e/testdata/secondary-controller
          IMG: ${{ steps.build-image.outputs.image }}
          SKIP_BUILD: "true"
          PROMETHEUS_ADAPTER_WAIT: "false"
          # Lower saturation thresholds for simulator mode (see e2e-tests-smoke).
          KV_SPARE_TRIGGER: "0.5"
          QUEUE_SPARE_TRIGGER: "4.5"
        run: |
          make test-e2e-multi-controller-with-setup
